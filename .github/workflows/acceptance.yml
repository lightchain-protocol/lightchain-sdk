# Testnet acceptance, from the wallet in TESTNET_WALLET_PRIVATE_KEY (it needs testnet LCAI).
# pool: mints a key, tops up on the first 402, then a streaming completion and two interleaved conversations through
# the OpenAI SDK. per-call: keyless pay-per-call, from a fresh wallet that wallet funds and that sends the rest back.
name: Testnet acceptance

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency: testnet-acceptance

jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run acceptance:pool 2>&1 | tee acceptance-pool.log
        env:
          WALLET_PRIVATE_KEY: ${{ secrets.TESTNET_WALLET_PRIVATE_KEY }}
          LIGHTCHAIN_NETWORK: testnet
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-pool-${{ github.run_id }}
          path: acceptance-pool.log

  # After pool, not beside it: both send from the same wallet, and two jobs at once would race for its nonce.
  per-call:
    needs: pool
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run acceptance:per-call:fresh 2>&1 | tee acceptance-per-call.log
        env:
          FUNDER_PRIVATE_KEY: ${{ secrets.TESTNET_WALLET_PRIVATE_KEY }}
          LIGHTCHAIN_NETWORK: testnet
          LIGHTCHAIN_MODEL: gemma4:e2b
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-per-call-${{ github.run_id }}
          path: acceptance-per-call.log
