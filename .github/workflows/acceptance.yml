# The pool acceptance flow against testnet: mints a key, tops up on the first 402, then a streaming completion and two
# interleaved conversations through the OpenAI SDK. The wallet in TESTNET_WALLET_PRIVATE_KEY needs testnet LCAI.
name: Testnet acceptance

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency: testnet-acceptance

jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run acceptance:pool 2>&1 | tee acceptance-pool.log
        env:
          WALLET_PRIVATE_KEY: ${{ secrets.TESTNET_WALLET_PRIVATE_KEY }}
          LIGHTCHAIN_NETWORK: testnet
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-pool-${{ github.run_id }}
          path: acceptance-pool.log
